server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;
    server_tokens off;

    # ── Security-Header ──────────────────────────────────────────────
    # Auf Server-Ebene gesetzt. Wichtig: In den location-Blöcken unten
    # bewusst KEIN add_header verwenden – nginx würde diese Header dort
    # sonst komplett verwerfen. Caching wird deshalb über "expires" gesteuert.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Entspricht dem <meta>-CSP in index.html, ergänzt um frame-ancestors
    # (das lässt sich nur per Header setzen).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    # Hinter einem TLS-Proxy (Caddy/Traefik) zusätzlich dort setzen:
    #   Strict-Transport-Security "max-age=31536000"

    # Kein Caching für Service Worker, HTML-Shell und App-Code,
    # damit Updates sofort ankommen.
    location = /service-worker.js { expires -1; }
    location = /index.html        { expires -1; }
    location = /app.js            { expires -1; }
    location = /core.js           { expires -1; }
    location = /sync.js           { expires -1; }

    # Statische Assets dürfen lange gecached werden.
    location ~* \.(png|jpg|jpeg|svg|json)$ {
        expires 7d;
    }

    # Nichts ausliefern, was nicht zur App gehört (versteckte Dateien etc.)
    location ~ /\. { return 404; }

    # SPA-Fallback: alles auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
