server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Kein Caching für den Service Worker & die HTML-Shell,
    # damit Updates sofort ankommen.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Statische Assets dürfen lange gecached werden.
    location ~* \.(png|jpg|jpeg|svg|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA-Fallback: alles auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # richtiger MIME-Type fürs Manifest

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
